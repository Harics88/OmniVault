name: Build Portable Apps

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build:nocheck

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-windows-portable:
    needs: build-frontend
    runs-on: windows-latest
    strategy:
      matrix:
        variant:
          - name: 'Desktop'
            spec: 'omni_vault.spec'
            folder: 'OmniVault'
            output_name: 'OmniVault_Desktop'
          - name: 'Server'
            spec: 'omni_vault_server.spec'
            folder: 'OmniVault-Server'
            output_name: 'OmniVault_Server'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jaraco.text jaraco.functools jaraco.context platformdirs

      - name: Inject Version
        run: |
          $ver = "${{ github.ref_name }}".Replace("v", "")
          if ($ver -eq "") { $ver = "2.6.9" }
          "VERSION = '$ver'" | Out-File -Encoding utf8 backend/app/version.py

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build ${{ matrix.variant.name }} executable
        working-directory: backend
        run: pyinstaller ${{ matrix.variant.spec }} --noconfirm

      - name: Unblock DLLs (Mark of the Web fix)
        shell: powershell
        run: |
          # Strip Windows "Mark of the Web" from all files so DLLs aren't blocked on target machines
          Get-ChildItem -Path "backend/dist/${{ matrix.variant.folder }}" -Recurse | Unblock-File -ErrorAction SilentlyContinue

      - name: Create portable package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          Compress-Archive -Path backend/dist/${{ matrix.variant.folder }} -DestinationPath "${{ matrix.variant.output_name }}_${version}_Portable.zip"

      - name: Upload ${{ matrix.variant.name }} Portable App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant.output_name }}-portable
          path: ${{ matrix.variant.output_name }}_*_Portable.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.variant.output_name }}_*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
