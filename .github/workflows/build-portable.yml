name: Build Portable Desktop App

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build-windows-portable:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jaraco.text jaraco.functools jaraco.context platformdirs

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build:nocheck

      - name: Build PyInstaller executable
        working-directory: backend
        run: |
          pyinstaller omni_vault.spec --clean --noconfirm

      - name: Create portable package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          
          # Create archive
          Compress-Archive -Path backend/dist/OmniVault -DestinationPath "OmniVault_${version}_Portable.zip"

      - name: Upload Windows Portable App
        uses: actions/upload-artifact@v4
        with:
          name: omni-vault-windows-portable
          path: OmniVault_*_Portable.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          files: OmniVault_*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
