name: Build Portable Apps

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build-windows-portable:
    runs-on: windows-latest
    
    strategy:
      matrix:
        variant:
          - name: 'Desktop'
            spec: 'omni_vault.spec'
            folder: 'OmniVault'
            output_name: 'OmniVault_Desktop'
            description: 'Desktop app with GUI window (PyWebView)'
          - name: 'Server'
            spec: 'omni_vault_server.spec'
            folder: 'OmniVault-Server'
            output_name: 'OmniVault_Server'
            description: 'Web server - access via browser at localhost:8000'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jaraco.text jaraco.functools jaraco.context platformdirs

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build:nocheck

      - name: Build ${{ matrix.variant.name }} executable
        working-directory: backend
        run: |
          pyinstaller ${{ matrix.variant.spec }} --clean --noconfirm

      - name: Create portable package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          
          # Create archive
          Compress-Archive -Path backend/dist/${{ matrix.variant.folder }} -DestinationPath "${{ matrix.variant.output_name }}_${version}_Portable.zip"

      - name: Upload ${{ matrix.variant.name }} Portable App
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant.output_name }}-portable
          path: ${{ matrix.variant.output_name }}_*_Portable.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.variant.output_name }}_*_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
