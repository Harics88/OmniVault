name: Build Tauri App

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for creating releases

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]  # Add macos-latest, ubuntu-20.04 for multi-platform
        
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clean npm cache (fix rollup optional deps bug)
        working-directory: frontend
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force }
          if (Test-Path "node_modules") { Remove-Item "node_modules" -Recurse -Force }
          npm cache clean --force

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install
          npm install --save-optional @rollup/rollup-win32-x64-msvc

      - name: Generate Tauri icons
        working-directory: frontend
        run: |
          npx @tauri-apps/cli icon public/omnivault-logo.png
          
      - name: Build frontend
        working-directory: frontend
        run: npm run build:nocheck

      - name: Install Tauri CLI
        working-directory: frontend
        run: npm install --save-dev @tauri-apps/cli

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Create Portable ZIP (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Create portable directory
          New-Item -ItemType Directory -Path "frontend/portable" -Force
          
          # Copy executable
          Copy-Item "frontend/src-tauri/target/release/omni-vault.exe" "frontend/portable/"
          
          # Create README for portable version
          @"
          # Omni Vault - Portable Edition
          
          ## How to Run
          1. Double-click 'omni-vault.exe'
          2. Your data will be stored in the same folder
          
          ## Features
          - No installation required
          - Run from USB drive or any location
          - All data stored locally
          - Fully portable - copy anywhere!
          
          ## System Requirements
          - Windows 10 or later (64-bit)
          
          For updates, visit: https://github.com/Harics88/MyTasker/releases
          "@ | Out-File -FilePath "frontend/portable/README.txt" -Encoding utf8
          
          # Create portable ZIP
          Compress-Archive -Path "frontend/portable/*" -DestinationPath "frontend/Omni-Vault-Portable-v1.0.0.zip" -Force

      - name: Upload Windows Installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omni-vault-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
      
      - name: Upload Windows Portable
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omni-vault-windows-portable
          path: frontend/Omni-Vault-Portable-v1.0.0.zip

      - name: Upload macOS DMG
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: omni-vault-macos-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux packages
        if: matrix.platform == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: omni-vault-linux-packages
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/Omni-Vault-Portable-v1.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
