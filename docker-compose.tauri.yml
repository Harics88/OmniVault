version: '3.8'

services:
  tauri-builder:
    build:
      context: .
      dockerfile: Dockerfile.tauri
    container_name: omnivault-tauri-builder
    volumes:
      # Mount the project directory
      - ./:/app
      # Cache for faster rebuilds
      - tauri-cargo-cache:/usr/local/cargo/registry
      - tauri-cargo-git:/usr/local/cargo/git
      - tauri-target-cache:/app/frontend/src-tauri/target
    working_dir: /app/frontend
    environment:
      - CARGO_HOME=/usr/local/cargo
    command: bash -c "echo 'Tauri builder ready. Run: docker-compose run tauri-builder npm run tauri:build'"

volumes:
  tauri-cargo-cache:
  tauri-cargo-git:
  tauri-target-cache:
